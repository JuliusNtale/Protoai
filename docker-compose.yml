services:
  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/proctoring-backend:${IMAGE_TAG:-latest}
    command: ["python", "run.py"]
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
      # Points at proctorai-prod-mirror-db, a standalone (non-compose)
      # postgres:15 container on the host restored from a production dump -
      # the only local Postgres this project uses. host.docker.internal
      # resolves the host loopback from inside this container, matching the
      # container's published port (15433:5432). Start it manually if it's
      # not already running:
      #   docker run -d --name proctorai-prod-mirror-db \
      #     -e POSTGRES_DB=mirror_db -e POSTGRES_USER=mirror_user \
      #     -e POSTGRES_PASSWORD=mirror_password -p 15433:5432 postgres:15
      DATABASE_URL: postgresql://mirror_user:mirror_password@host.docker.internal:15433/mirror_db
      JWT_SECRET: change-this-in-production-256-bit-secret
      JWT_EXPIRY_HOURS: "8"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-internal-secret-change-in-prod}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ADMIN_EMAIL: admin@udom.ac.tz
      AI_SERVICE_URL: http://ai-service:8000
      FLASK_ENV: development
      # Enables the local-only Exam Lab bootstrap endpoints (app/devtools).
      # Requires FLASK_ENV=development above too - see app/config.py. Set to
      # "false" (or unset) to keep this dev-only surface off even locally.
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-true}
    volumes:
      - ./storage:/app/storage
      # Bind-mounts live source over the image's built-in copy so run.py's
      # debug reloader (see backend/run.py) picks up edits instantly - no
      # more `docker-compose build backend` after every change.
      - ./backend:/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  ai-service:
    build: ./ai-service
    command: ["python", "app.py"]
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:5000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-internal-secret-change-in-prod}
      MODELS_DIR: ./models
      FACE_SIMILARITY_THRESHOLD: "0.6"
      GAZE_AWAY_SECONDS: ${GAZE_AWAY_SECONDS:-2}
      GAZE_CONFIDENCE_THRESHOLD: ${GAZE_CONFIDENCE_THRESHOLD:-0.4}
      HEAD_TURNED_SECONDS: ${HEAD_TURNED_SECONDS:-2}
      HEAD_YAW_THRESHOLD: ${HEAD_YAW_THRESHOLD:-30}
      HEAD_PITCH_THRESHOLD: ${HEAD_PITCH_THRESHOLD:-20}
      FACE_ABSENT_SECONDS: ${FACE_ABSENT_SECONDS:-2}
      MULTIPLE_FACES_SECONDS: ${MULTIPLE_FACES_SECONDS:-2}
      IDENTITY_RECHECK_SECONDS: ${IDENTITY_RECHECK_SECONDS:-8}
      IDENTITY_MISMATCH_CONFIRM_COUNT: ${IDENTITY_MISMATCH_CONFIRM_COUNT:-2}
      WARNING_COOLDOWN_SECONDS: ${WARNING_COOLDOWN_SECONDS:-5}
      FLASK_ENV: development
    volumes:
      # Bind-mounts live source (including models/, gitignored and excluded
      # from the image build via .dockerignore) so edits are picked up
      # instantly. `python app.py` (this service's command) hits the
      # `debug=True` branch in app.py's __main__ block since FLASK_ENV is
      # development, and flask-socketio's run() supports the Werkzeug
      # reloader under eventlet explicitly - restarting the process (and
      # reloading the ONNX models) automatically on any file change.
      - ./ai-service:/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      # Purely a UI hint for the exam page's mock-monitoring toggle (see
      # frontend/app/exam/page.tsx). The actual Exam Lab endpoints are
      # gated server-side by the backend's ENABLE_DEV_TOOLS, independent of
      # this - see backend/app/config.py.
      NEXT_PUBLIC_ENABLE_DEV_TOOLS: ${NEXT_PUBLIC_ENABLE_DEV_TOOLS:-true}
    depends_on:
      - backend
      - ai-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
